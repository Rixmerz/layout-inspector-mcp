<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test Layout</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #333; color: white; z-index: 100; display: flex; align-items: center; padding: 0 20px; }
  .main { margin-top: 60px; padding: 20px; }
  /* BUG: this modal is behind the header */
  .modal { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 400px; height: 300px; background: white; border: 2px solid red; z-index: 50; padding: 20px; }
  /* BUG: this element goes off-screen right */
  .wide-box { width: 1500px; height: 100px; background: lightblue; margin-top: 20px; }
  /* BUG: tiny button */
  .tiny-btn { width: 20px; height: 20px; font-size: 8px; }
  /* Text truncation */
  .truncated { width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="header"><h1>Header (z-index: 100)</h1></div>
  <div class="modal"><p>Modal (z-index: 50 — hidden behind header!)</p></div>
  <div class="main">
    <h2>Content</h2>
    <div class="wide-box">I'm 1500px wide — causes horizontal scroll</div>
    <button class="tiny-btn">X</button>
    <p class="truncated">This is a very long text that will definitely be truncated by CSS ellipsis</p>
  </div>
</body>
</html>
