[project]
name = "layout-inspector-mcp"
version = "0.4.0"
description = "MCP server that inspects rendered web page layouts via headless browser, returning spatial/geometric data for AI agents to reason about positioning, overlaps, and responsive issues."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Pablo Diaz", email = "juanpablo516@gmail.com" }]
keywords = ["mcp", "layout", "playwright", "visual-qa", "responsive", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=2.0,<4",
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/Rixmerz/layout-inspector-mcp"
Issues = "https://github.com/Rixmerz/layout-inspector-mcp/issues"

[project.scripts]
layout-inspector-mcp = "layout_inspector.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["layout_inspector*"]

[tool.setuptools.package-data]
layout_inspector = ["js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs a real Chromium; deselect with -m 'not integration'",
]
filterwarnings = ["error::DeprecationWarning:layout_inspector.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["layout_inspector"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
